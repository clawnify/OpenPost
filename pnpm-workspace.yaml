# esbuild and workerd need their install scripts to produce a usable binary;
# sharp is an optional image dependency nothing here uses. pnpm 11 leaves this
# key as an unanswered stub on first install and refuses to install until it's
# decided.
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  # First-party Clawnify packages — exempt from the new-release age gate so app
  # builds pick up fresh versions promptly.
  - '@clawnify/routes'
  - '@clawnify/app'
